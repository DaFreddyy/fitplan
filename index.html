<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#161021">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitPlan">
<title>FitPlan – Training & Ernährung</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#161021;--bg-2:#1f1530;--surface:#241a37;--surface-2:#2d2143;--line:#3a2c55;
    --ink:#f4ecff;--muted:#b3a3cf;--faint:#7c6aa0;--coral:#ff5e7a;--tangerine:#ff9a3d;--green:#5fd28f;
    --grad:linear-gradient(100deg,#ff5e7a 0%,#ff9a3d 100%);--radius:18px;--shadow:0 18px 40px -18px rgba(0,0,0,.7);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --nav-h:64px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--font);color:var(--ink);background:
      radial-gradient(1100px 600px at 85% -10%,rgba(255,154,61,.16),transparent 60%),
      radial-gradient(900px 500px at -5% 0%,rgba(255,94,122,.18),transparent 55%),var(--bg);
    min-height:100dvh;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));}
  .wrap{max-width:780px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 24px}
  h1,h2,h3,h4{letter-spacing:-.01em}
  header.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .logo{width:42px;height:42px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-size:22px;box-shadow:0 8px 22px -8px rgba(255,94,122,.7);transform:rotate(-6deg)}
  header.top h1{font-size:1.35rem;font-weight:800;line-height:1}
  header.top .sub{color:var(--muted);font-size:.74rem;margin-top:2px}
  .profchip{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-size:.85rem;font-weight:600}
  .profchip .av{width:26px;height:26px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:.8rem;color:#1a1024;font-weight:800}

  .btn{font-family:var(--font);font-weight:600;font-size:.92rem;border:none;cursor:pointer;border-radius:12px;padding:11px 16px;color:#1a1024;background:var(--grad);box-shadow:0 10px 22px -10px rgba(255,122,77,.8);transition:transform .12s}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn.danger{background:transparent;color:var(--coral);border:1px solid #5a2740;box-shadow:none}
  .btn.block{width:100%}
  .inp{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:11px 13px;font-size:1rem;outline:none;font-family:var(--font)}
  .inp:focus{border-color:var(--coral)}
  label.fld{display:block;margin-bottom:12px}
  label.fld span{display:block;font-size:.82rem;color:var(--muted);font-weight:500;margin-bottom:6px}

  .view{display:none;animation:rise .3s both}
  .view.active{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .sec-title{font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--tangerine);margin:22px 0 10px}
  .muted{color:var(--muted)}.faint{color:var(--faint)}

  /* cards / chips */
  .card{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:transform .12s,border-color .12s}
  .card:active{transform:scale(.99)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:.85rem;font-weight:600;cursor:pointer}
  .chip.active{background:var(--ink);color:#1a1024;border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .rcard{position:relative;overflow:hidden}
  .rcard .emoji{font-size:30px;display:block;margin-bottom:8px}
  .rcard h3{font-size:1rem;font-weight:700;margin-bottom:5px}
  .rcard .meta{color:var(--faint);font-size:.76rem}
  .rcard .tag{position:absolute;top:12px;right:12px;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--muted)}

  /* search */
  .search{position:relative;margin:14px 0}
  .search input{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:13px;padding:12px 14px 12px 38px;font-size:.95rem;outline:none;font-family:var(--font)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6}

  /* nav bar */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:60;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
    background:rgba(22,16,33,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex}
  .nav button{flex:1;background:none;border:none;color:var(--faint);font-family:var(--font);font-size:.66rem;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding-top:8px}
  .nav button{font-size:.6rem;padding-left:1px;padding-right:1px}
  .nav button .ic{font-size:1.2rem;line-height:1}

  /* freunde / feed */
  .feeditem{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px;margin-bottom:10px}
  .feeditem .fh{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .fav{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#1a1024;font-weight:800;flex-shrink:0}
  .feeditem .fn{font-weight:700}
  .feeditem .ft{color:var(--faint);font-size:.74rem}
  .feeditem .fbody{font-size:.95rem;margin-bottom:9px;display:flex;align-items:center;gap:8px}
  .feeditem .fact{display:flex;gap:16px;align-items:center;border-top:1px solid var(--line);padding-top:9px}
  .feeditem .fact button{background:none;border:none;color:var(--muted);font-family:var(--font);font-size:.86rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px}
  .feeditem .fact button.liked{color:var(--coral)}
  .cmtlist{margin-top:9px;display:flex;flex-direction:column;gap:4px}
  .cmt{font-size:.86rem;line-height:1.4;padding:4px 0}
  .cmt b{color:var(--ink)}
  .cmtbox{display:flex;gap:8px;margin-top:9px}
  .cmtbox input{flex:1}
  .reqrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .reqrow .nm{flex:1;font-weight:600}
  .reqrow button{border:none;border-radius:9px;padding:7px 11px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:var(--font)}
  .reqrow .ok{background:var(--grad);color:#1a1024}
  .reqrow .no{background:var(--surface-2);color:var(--coral);border:1px solid var(--line)}
  .secount{color:var(--faint);font-weight:600;font-size:.78rem;margin-left:6px}
  .nav button.active{color:var(--ink)}
  .nav button.active .ic{filter:drop-shadow(0 0 10px rgba(255,94,122,.6))}

  /* calendar */
  .calnav{display:flex;align-items:center;gap:8px;margin:8px 0 14px;flex-wrap:wrap}
  .navbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.2rem;cursor:pointer}
  #calLabel{font-weight:800;font-size:1.02rem;min-width:130px;text-align:center}
  .today-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:0 12px;height:38px;cursor:pointer;font-size:.84rem;font-weight:600}
  #calViews{margin-left:auto;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px}
  #calViews button{border:none;background:none;color:var(--muted);font-weight:600;font-size:.82rem;padding:7px 12px;border-radius:8px;cursor:pointer;font-family:var(--font)}
  #calViews button.active{background:var(--grad);color:#1a1024}
  .calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
  .calhead span{text-align:center;font-size:.66rem;color:var(--faint);font-weight:700;text-transform:uppercase}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .dcell{position:relative;aspect-ratio:.78;border:1px solid var(--line);background:var(--surface);border-radius:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);overflow:hidden;padding:2px}
  .dcell .dn{position:absolute;top:4px;left:6px;font-size:.66rem;color:var(--faint);font-weight:700}
  .dcell .wic{font-size:1.05rem;margin-top:8px}
  .dcell .mdot{font-size:.5rem;color:var(--tangerine)}
  .dcell.done{background:var(--grad);border-color:transparent;color:#1a1024}
  .dcell.done .dn{color:#1a1024}
  .dcell.rest{opacity:.6}
  .dcell.today{outline:2px solid var(--coral);outline-offset:1px}
  .dcell.faded{opacity:.32}

  .weekrow{display:flex;flex-direction:column;gap:8px}
  .wkr{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:11px 13px;cursor:pointer}
  .wkr.today{outline:2px solid var(--coral);outline-offset:1px}
  .wkr .l{display:flex;flex-direction:column;align-items:center;min-width:42px;flex-shrink:0}
  .wkr .l b{font-size:1.02rem;font-weight:800}
  .wkr .l small{font-size:.7rem;color:var(--faint)}
  .wkr .m{flex:1;min-width:0}
  .wkr .m .wtitle{font-weight:700;font-size:.95rem;margin-bottom:4px}
  .wkr .m .meals{display:flex;flex-wrap:wrap;gap:4px}
  .wkr .m .meals span{font-size:.7rem;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);max-width:150px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

  /* overlay */
  .overlay{position:fixed;inset:0;z-index:80;background:rgba(10,6,18,.74);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 12px calc(28px + env(safe-area-inset-bottom))}
  .overlay.open{display:flex}
  .panel{width:100%;max-width:600px;background:var(--bg-2);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px;margin:auto 0;animation:pop .22s both}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
  .phead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
  .phead .emoji{font-size:34px}
  .phead h2{font-size:1.35rem;font-weight:800;margin-right:auto;line-height:1.1}
  .pcat{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
  .close{background:var(--surface);border:1px solid var(--line);color:var(--ink);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:1.1rem;flex-shrink:0}
  ul. list{list-style:none}
  ol.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:11px;margin:4px 0}
  ol.steps li{counter-increment:s;display:flex;gap:12px;font-size:.95rem;line-height:1.45}
  ol.steps li::before{content:counter(s);background:var(--grad);color:#1a1024;font-weight:800;width:25px;height:25px;border-radius:7px;display:grid;place-items:center;flex-shrink:0;font-size:.82rem}
  ul.dlist{list-style:none;display:flex;flex-direction:column;gap:7px;margin:4px 0}
  ul.dlist li{display:flex;gap:10px;font-size:.92rem;line-height:1.4;color:var(--muted);padding-left:16px;position:relative}
  ul.dlist li::before{content:'•';position:absolute;left:2px;color:var(--coral)}
  .ings li{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.94rem;list-style:none}
  .ings li .amt{font-weight:700;color:var(--tangerine);min-width:86px}
  .notes{background:var(--surface);border-left:3px solid var(--tangerine);border-radius:8px;padding:11px 13px;color:var(--muted);font-size:.88rem;margin-top:14px;line-height:1.5}
  .ytwrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:#000}
  .ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .actions{display:flex;gap:10px;margin-top:18px}.actions .btn{flex:1}

  /* list rows (swap/select) */
  .lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;color:var(--ink);font-family:var(--font);margin-bottom:8px}
  .lrow.cur{border-color:var(--tangerine)}
  .lrow .em{font-size:1.5rem;flex-shrink:0}
  .lrow .info{flex:1;min-width:0}
  .lrow .info b{display:block;font-size:.95rem}
  .lrow .info small{color:var(--faint);font-size:.76rem}
  .lrow .go{color:var(--faint);font-size:1.1rem;flex-shrink:0}
  .lrow .rcat{font-size:.66rem;color:var(--tangerine);font-weight:700;text-transform:uppercase}
  .exitem{display:flex;align-items:center;gap:10px;border-bottom:1px dashed var(--line);padding:11px 0}
  .exitem .x{flex:1}.exitem .x b{font-size:.95rem}.exitem .x small{display:block;color:var(--faint);font-size:.78rem}
  .exitem .swp{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:6px 10px;font-size:.76rem;cursor:pointer;font-weight:600}

  /* shopping */
  .deptblock{margin-bottom:16px}
  .deptblock h4{font-size:.92rem;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:7px;color:var(--tangerine)}
  .shitem{display:flex;align-items:center;gap:11px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:.92rem}
  .shitem input{width:22px;height:22px;flex-shrink:0;accent-color:#ff5e7a}
  .shitem .amt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.86rem}
  .shitem.checked .nm{text-decoration:line-through;color:var(--faint)}

  /* player */
  .player{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
  .player.open{display:flex}
  .player .ptop{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .player .ptop .prog{flex:1;height:7px;background:var(--surface);border-radius:999px;overflow:hidden}
  .player .ptop .prog i{display:block;height:100%;background:var(--grad);width:0;transition:width .3s}
  .player .pclose{background:var(--surface);border:1px solid var(--line);color:var(--ink);width:36px;height:36px;border-radius:10px;font-size:1rem;cursor:pointer}
  .player .pbody{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:10px;overflow-y:auto}
  .player .pstep{color:var(--tangerine);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem}
  .player .pname{font-size:1.8rem;font-weight:800;line-height:1.1}
  .player .pmeta{color:var(--muted);font-size:1.05rem}
  .player .pinstr{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:6px auto 0;max-width:520px;width:100%}
  .player .pinstr ol{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
  .player .pinstr li{counter-increment:s;display:flex;gap:10px;font-size:.92rem;line-height:1.4;text-align:left}
  .player .pinstr li::before{content:counter(s);background:var(--grad);color:#1a1024;font-weight:800;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex-shrink:0;font-size:.78rem}
  .player .yt-link{display:inline-block;margin-top:10px;color:var(--coral);font-weight:600;font-size:.9rem;text-decoration:none}
  .timer-num{font-size:4.5rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .timer-count{font-size:7rem;font-weight:800;color:var(--coral);line-height:1;animation:pulse .5s}
  @keyframes pulse{from{transform:scale(1.3);opacity:.4}to{transform:scale(1);opacity:1}}
  .player .pctrl{display:flex;gap:10px;margin-top:14px}
  .player .pctrl .btn{flex:1;padding:15px}
  .player .pmini{display:flex;gap:10px;margin-top:10px}
  .player .pmini button{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;font-size:.86rem;font-weight:600;cursor:pointer;font-family:var(--font)}

  .toast{position:fixed;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#1a1024;font-weight:700;padding:11px 18px;border-radius:12px;font-size:.88rem;opacity:0;pointer-events:none;transition:all .3s;z-index:100;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{text-align:center;color:var(--muted);padding:40px 16px}

  /* auth */
  .authscreen{position:fixed;inset:0;z-index:120;display:none;flex-direction:column;align-items:center;justify-content:center;overflow-y:auto;padding:calc(28px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
    background:radial-gradient(900px 500px at 80% -10%,rgba(255,154,61,.18),transparent 60%),radial-gradient(800px 500px at -10% 0%,rgba(255,94,122,.2),transparent 55%),var(--bg)}
  .authscreen.open{display:flex}
  .authcard{width:100%;max-width:380px;margin:auto}
  .authcard .brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;text-align:center}
  .authcard .brand .logo{width:60px;height:60px;border-radius:17px;font-size:30px}
  .authcard .brand h1{font-size:1.6rem;font-weight:800}
  .authcard .brand p{color:var(--muted);font-size:.85rem}
  .authcard h2{font-size:1.15rem;font-weight:800;margin-bottom:14px;text-align:center}
  .authcard .err{background:rgba(255,94,122,.12);border:1px solid #5a2740;color:var(--coral);border-radius:11px;padding:10px 12px;font-size:.85rem;margin-bottom:12px;line-height:1.4}
  .authcard .ok{background:rgba(95,210,143,.12);border:1px solid #2f5a40;color:var(--green);border-radius:11px;padding:10px 12px;font-size:.85rem;margin-bottom:12px;line-height:1.4}
  .authcard .swlink{text-align:center;margin-top:14px;color:var(--muted);font-size:.88rem}
  .authcard .swlink a{color:var(--coral);font-weight:600;cursor:pointer;text-decoration:none}
  .authcard .forgot{text-align:right;margin:-4px 0 12px}
  .authcard .forgot a{color:var(--faint);font-size:.8rem;cursor:pointer}
  .authcard .legal{color:var(--faint);font-size:.72rem;text-align:center;margin-top:18px;line-height:1.5}
  .pill-toggle{display:flex;flex-wrap:wrap;gap:8px}
  .pill-toggle button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:var(--font)}
  .pill-toggle button.on{background:var(--grad);color:#1a1024;border-color:transparent}
  .planopt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px;cursor:pointer;margin-bottom:9px}
  .planopt.sel{border-color:var(--coral);box-shadow:inset 0 0 0 1px var(--coral)}
  .planopt .pi{font-size:1.7rem}.planopt .pt b{display:block}.planopt .pt small{color:var(--faint);font-size:.8rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">🏋️</div>
    <div>
      <h1>FitPlan</h1>
      <div class="sub">Training · Ernährung · Einkauf</div>
    </div>
    <div class="profchip" id="profChip" onclick="go('profile')"><span class="av" id="profAv">?</span><span id="profName">Profil</span></div>
  </header>

  <div class="view" id="v-plan"></div>
  <div class="view" id="v-training"></div>
  <div class="view" id="v-recipes"></div>
  <div class="view" id="v-shop"></div>
  <div class="view" id="v-friends"></div>
  <div class="view" id="v-profile"></div>
</div>

<nav class="nav" id="nav">
